[manifest]
version = "0.1.0"
dump_lua = true
priority = 1

[[patches]]
[patches.pattern]
target = "engine/ui.lua"
pattern = '''
if self.config.detailed_tooltip and G.CONTROLLER.HID.pointer then
    self.config.h_popup = create_UIBox_detailed_tooltip(self.config.detailed_tooltip)
    self.config.h_popup_config ={align="tm", offset = {x=0,y=-0.1}, parent = self}
'''
position = "at"
payload = '''
if self.config.detailed_tooltip and G.CONTROLLER.HID.pointer then
self.config.h_popup = create_UIBox_detailed_tooltip(self.config.detailed_tooltip)
if self.config.detailed_tooltip.key == "chat_chaos_desc" then
    self.config.h_popup_config = { align = "tm", offset = { x = 2.5, y = -0.1}, parent = self }
else
    self.config.h_popup_config ={align="tm", offset = {x=0,y=-0.1}, parent = self}
end
'''
match_indent = true

